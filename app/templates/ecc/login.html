{% extends "base2.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<style>
    .login-container {
        width: 50%;
        margin: 30px auto 0 auto;
    }

    .login-container .card {
        width: 100%;
    }

    .login-container .card-content {
        padding: 30px;
    }

    .login-container h2 {
        margin-bottom: 15px;
    }

    .login-container form {
        margin-top: 25px;
    }

    .login-container .btn {
        width: 100%;
    }

    /* Celulares e telas menores */
    @media (max-width: 768px) {
        .login-container {
            width: 90%;
        }
    }
</style>

<div class="page-header">
    <h1>
        <i class="fas fa-sign-in-alt"></i>
        Login
    </h1>
</div>

<div class="login-container">

    <div class="card card-welcome">

        <div class="card-content">

            <h2>Acesso ao Sistema</h2>

            <p>
                Informe suas credenciais para acessar o painel administrativo.
            </p>

            <form method="POST">

                <!-- Usuário -->
                <div class="form-group">
                    <label for="usuario">
                        <i class="fas fa-user"></i>
                        Usuário
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        class="form-control"
                        placeholder="Digite seu usuário"
                        required
                        autofocus>
                </div>

                <!-- Senha -->
                <div class="form-group mt-3">
                    <label for="senha">
                        <i class="fas fa-lock"></i>
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        class="form-control"
                        placeholder="Digite sua senha"
                        required>
                </div>

                <!-- Botão -->
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i>
                        Entrar
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
